<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>설문 집계기</title>
</head>
<body>
<!-- 계산 로직: 화면과 분리된 순수 함수. tests/core.test.js가 이 블록만 꺼내 시험한다. -->
<script id="tally-core">
(function (root) {
  'use strict';

  /**
   * 엑셀에서 복사한 탭 구분 텍스트를 줄 × 칸 배열로 바꾼다.
   * - 줄바꿈: \r\n, \n, \r
   * - 따옴표로 시작하는 칸은 엑셀식 따옴표 칸으로 읽는다("" → ").
   *   닫는 따옴표 뒤가 탭·줄바꿈·끝이 아니면 따옴표 칸이 아닌 것으로 보고 글자 그대로 읽는다.
   * - 입력 끝의 완전히 빈 줄은 버린다.
   */
  function parseTSV(text) {
    var s = String(text == null ? '' : text);
    var rows = [];
    var row = [];
    var i = 0;
    var n = s.length;

    function isEnd(ch) { return ch === undefined || ch === '\t' || ch === '\n' || ch === '\r'; }

    while (i <= n) {
      var value = null;
      if (s[i] === '"') {
        // 따옴표 칸 시도
        var j = i + 1;
        var buf = '';
        var ok = false;
        while (j < n) {
          if (s[j] === '"') {
            if (s[j + 1] === '"') { buf += '"'; j += 2; continue; }
            ok = isEnd(s[j + 1]);
            j += 1;
            break;
          }
          buf += s[j];
          j += 1;
        }
        if (ok) { value = buf; i = j; }
      }
      if (value === null) {
        var k = i;
        while (k < n && !isEnd(s[k])) k += 1;
        value = s.slice(i, k);
        i = k;
      }
      row.push(value);

      var ch = s[i];
      if (ch === '\t') { i += 1; continue; }
      rows.push(row);
      row = [];
      if (ch === '\r' && s[i + 1] === '\n') i += 2;
      else i += 1; // \n, \r, 또는 끝(i가 n+1이 되어 반복 종료)
    }

    while (rows.length && rows[rows.length - 1].length === 1 && rows[rows.length - 1][0] === '') {
      rows.pop();
    }
    return rows;
  }

  /** 칸 하나를 판정한다: { kind: 'valid', value } | { kind: 'blank' } | { kind: 'excluded' } */
  function classifyCell(cell) {
    var t = cell == null ? '' : String(cell).trim();
    if (t === '') return { kind: 'blank' };
    if (t === '1' || t === '2' || t === '3' || t === '4' || t === '5') {
      return { kind: 'valid', value: Number(t) };
    }
    return { kind: 'excluded' };
  }

  /**
   * 평균 문자열. 합 ÷ 수를 소수 셋째 자리에서 반올림(0.5는 올림)해 둘째 자리까지.
   * sum, count는 0 이상의 정수. 정수 연산만 써서 부동소수 오차가 없다.
   */
  function formatAverage(sum, count) {
    if (!count) return '-';
    var hundredths = Math.floor((200 * sum + count) / (2 * count)); // round(sum*100/count), 반올림
    var whole = Math.floor(hundredths / 100);
    var frac = hundredths % 100;
    return whole + '.' + (frac < 10 ? '0' : '') + frac;
  }

  /**
   * 붙여넣은 텍스트를 집계한다.
   * 반환: { questions: [{ name, valid, sum, average, blank, excluded }], responseCount }
   */
  function tally(text) {
    var rows = parseTSV(text);
    if (rows.length === 0) return { questions: [], responseCount: 0 };
    var header = rows[0];
    var questions = [];
    for (var c = 1; c < header.length; c += 1) {
      questions.push({ name: header[c].trim(), valid: 0, sum: 0, average: '-', blank: 0, excluded: 0 });
    }
    for (var r = 1; r < rows.length; r += 1) {
      var row = rows[r];
      for (var q = 0; q < questions.length; q += 1) {
        var result = classifyCell(row[q + 1]); // 모자란 칸은 undefined → 빈 응답
        var stat = questions[q];
        if (result.kind === 'valid') { stat.valid += 1; stat.sum += result.value; }
        else if (result.kind === 'blank') stat.blank += 1;
        else stat.excluded += 1;
      }
    }
    for (var x = 0; x < questions.length; x += 1) {
      questions[x].average = formatAverage(questions[x].sum, questions[x].valid);
    }
    return { questions: questions, responseCount: rows.length - 1 };
  }

  var api = { parseTSV: parseTSV, classifyCell: classifyCell, formatAverage: formatAverage, tally: tally };
  if (typeof module === 'object' && module && module.exports) module.exports = api;
  else root.SurveyTally = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
</body>
</html>
